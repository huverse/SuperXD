name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-check:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --coverage --reporter expanded
      # 基准图（test/golden_test.dart）对不上时把差异图留下来，下载看过再决定是修代码还是重生成。
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: golden-failures
          path: test/failures
          if-no-files-found: ignore
          retention-days: 14
      # lib 的行覆盖率低于门槛就失败（门槛与 [人工决策] 在工具文件里）。
      - run: dart run tool/coverage_check.dart

  # [人工决策-2026-10-26 20:18:03] iOS 只出未签名 ipa，测试者在手机上用全能签加自己的证书签名安装（用户选定，不买开发者账号、不走 TestFlight）。
  # 本机是 Linux、没有 Mac，iOS 只能在这里编译；PR 包不带中转地址与高德 key，私信、代签、更新与地图不可用。
  # 系统玻璃（UIGlassEffect、玻璃按钮）要 iOS 26 SDK，固定用带 Xcode 26 的 macos-26 镜像。
  ios-build:
    name: iOS build
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # CocoaPods 的下载（高德 SDK 很大）每次现下容易碰上网络偶发失败（10-26 一次 curl HTTP2 报错让 pod install 失败）：只缓存下载，依赖版本照旧每次解析，不因缓存在不在而变。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'ios/Podfile') }}
          restore-keys: pods-${{ runner.os }}-
      - run: flutter build ios --release --no-codesign --flavor alpha
      - name: Package unsigned ipa
        run: |
          mkdir -p build/ios-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios-ipa/Payload/
          cd build/ios-ipa && zip -qry SuperXD-alpha-unsigned.ipa Payload
      # 测试包的 dSYM 一起留着，装这个包闪退时才能把崩溃报告还原成函数名（同发版流水线）。
      - name: Package dSYMs
        run: |
          set -euo pipefail
          mkdir -p build/ios-dsym
          find build/ios -maxdepth 3 -name '*.dSYM' -print0 | xargs -0 -I{} cp -R {} build/ios-dsym/
          if [ -z "$(ls build/ios-dsym)" ]; then echo "::warning::没找到 dSYM"; exit 0; fi
          cd build/ios-dsym && zip -qry ../ios-ipa/SuperXD-alpha-dSYMs.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-unsigned-ipa
          path: |
            build/ios-ipa/SuperXD-alpha-unsigned.ipa
            build/ios-ipa/SuperXD-alpha-dSYMs.zip
          retention-days: 14
      # [人工决策-2026-11-10 12:58:48] iOS 依赖锁定（用户同意按最佳实践处理）：CocoaPods 的 ios/Podfile.lock 与 Swift Package 的 Package.resolved 都提交进仓库，
      # 构建把它们改写了或新生成了就失败，并把新锁文件上传成产物 ios-lockfiles，由维护者核对后提交（本机没有 Mac，取法见 CONTRIBUTING.md「供应链」）。
      # 放在测试包上传之后，锁文件对不上时测试包照样留着；没选只告警不失败（锁文件会悄悄漂移，构建就又不可复现了）。
      - name: Check iOS lockfiles
        id: ios-locks
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all -- ios
          changed=$(git status --porcelain --untracked-files=all -- ios/Podfile.lock ':(glob)ios/**/Package.resolved')
          if [ -n "$changed" ]; then echo "::error::iOS 锁文件被构建改写或新生成，下载产物 ios-lockfiles 核对后提交：${changed//$'\n'/ ; }"; exit 1; fi
      - if: failure() && steps.ios-locks.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-lockfiles
          path: |
            ios/Podfile.lock
            ios/**/Package.resolved
          retention-days: 14

  relay-check:
    name: Relay server test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root
          MYSQL_DATABASE: superxd_relay_test
          MYSQL_USER: superxd
          MYSQL_PASSWORD: test
        ports: ['3307:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest-root --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['6380:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: mysql -h 127.0.0.1 -P 3307 -usuperxd -ptest superxd_relay_test < sql/schema.sql
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 编译产物能在 Node ESM 下加载（Vitest 不经过编译产物，测不到）。
      - run: npm run build && npm run smoke
