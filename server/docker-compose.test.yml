# 本机跑 e2e 用的临时 MySQL 与 Redis：docker compose -f docker-compose.test.yml up -d --wait
# 用宿主机网络并改端口（MySQL 3307、Redis 6380），不依赖容器虚拟网卡，也不占用本机已有的 3306/6379。
services:
  mysql:
    image: mysql:8.4
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: test-root
      MYSQL_DATABASE: superxd_relay_test
      MYSQL_USER: superxd
      MYSQL_PASSWORD: test
    command: ["--port=3307", "--bind-address=127.0.0.1", "--mysqlx=OFF", "--max-execution-time=5000", "--innodb-lock-wait-timeout=5", "--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    tmpfs: ["/var/lib/mysql"]
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 3307 -usuperxd -ptest superxd_relay_test -e 'SELECT 1 FROM message LIMIT 1'"]
      interval: 3s
      timeout: 5s
      retries: 60
  redis:
    image: redis:8-alpine
    network_mode: host
    command: ["redis-server", "--port", "6380", "--bind", "127.0.0.1", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
