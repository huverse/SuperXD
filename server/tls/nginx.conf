# 中转前面的 HTTPS（人工决策见 docker-compose.yml 的 tls）：8443 用 Let's Encrypt 公网 IP 证书终止 HTTPS 转给内网里的中转，80 只给证书签发验证。
# 客户端按 IP 连接时不带 SNI，所以每个端口只配一张证书。证书文件由 scripts/tls_cert.sh 放进 tls-certs 卷，换证书后 nginx -s reload。
worker_processes 1;
events { worker_connections 512; }
http {
  server_tokens off;
  access_log off;
  error_log /dev/stderr warn;
  # 最大的请求是诊断包上传（服务端上限见 src/config/relay_limits.ts），留余量。
  client_max_body_size 32m;
  # 私信收取是长轮询、诊断包上传最长 5 分钟（同 src/common/http_server.ts 的 330 秒）：读写超时放宽，回复不缓冲。
  proxy_read_timeout 330s;
  proxy_send_timeout 330s;
  proxy_buffering off;
  proxy_request_buffering off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:2m;
  ssl_session_timeout 1h;

  server {
    listen 80;
    location /.well-known/acme-challenge/ { root /srv/acme; }
    location / { return 404; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/key.pem;
    # 中转在 compose 内网里叫 relay、端口同 .env 的 RELAY_PORT（8080）。部署时重建中转容器、内网地址会变：
    # 经 docker 内置 DNS 每 10 秒重新解析，不在启动时解析一次就钉死（那样换完中转会一直 502）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $relay_upstream http://relay:8080;
    location / {
      proxy_pass $relay_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # 覆盖而不是追加：客户端自己写的 X-Forwarded-For 不传下去，中转只信内网来的这一个值。
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
