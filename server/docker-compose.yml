# 单机部署：中转服务 + MySQL + Redis。只对外暴露中转端口，数据库与缓存只在内部网络。
# 用法见 README「部署」：复制 .env.example 为 .env 并改密码；中转镜像用流水线构建、服务器 docker load 后按 RELAY_IMAGE 运行，本机构建（--build）只作退路。
services:
  relay:
    # 默认 superxd-relay:local（本机 --build 的产物）；正式部署在 .env 写 RELAY_IMAGE=superxd-relay:<提交号>（docker load 进来的镜像）。
    image: ${RELAY_IMAGE:-superxd-relay:local}
    # 只用本机已有的镜像、不去仓库拉；配合 up --no-build，标签写错时直接报错，不会悄悄在服务器上现场构建。
    pull_policy: never
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY}
        # 本机构建时可在命令前写 RELAY_BUILD_VERSION=<提交号>；不要写进 .env（env_file 会盖掉镜像里的值）。
        RELAY_BUILD_VERSION: ${RELAY_BUILD_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RELAY_RELEASES_DIR: /srv/releases
      RELAY_DIAGNOSTICS_DIR: /srv/diagnostics
      # 业务时区只在这一处定（同客户端 campusTimeZone），换时区改这里。
      RELAY_BUSINESS_TIME_ZONE: Asia/Shanghai
      # V8 堆上限，见下面的 mem_limit。
      NODE_OPTIONS: --max-old-space-size=256
    # [人工决策-2026-11-17 21:24:25] 容器内存上限（用户同意审查建议 P2-7）：1.6GB 的机器上同时跑三个容器，以前都没上限，内存吃紧时系统随机杀进程。
    # 现在各有上限：超限只杀超限的那个容器，由 restart 拉起；整机吃紧时系统先杀中转（oom_score_adj 500）、最后才杀 MySQL（-500）。合计约 1.34GB。
    # 中转 512MB：V8 堆 256MB，堆外留给 scrypt（同时最多 passwordHashConcurrency 个、各约 32MB）、连接与请求缓冲；平时约 100MB。
    # [人工决策-2026-11-19 18:17:27] 维持 512MB、不放到 576MB（用户让按业界最佳实践定）：线上实测常驻 104–121MiB，只用了上限的约四分之一，堆是上限的一半（常用口径 50–75%）；
    # 四个容器上限合计已接近 1.6GB 整机内存，再加只会让整机超卖。看门狗或告警出现中转被杀（OOM）再按实测调。
    mem_limit: 512m
    oom_score_adj: 500
    # 应用更新的清单与安装包：发版时放进宿主机 ./releases，容器只读。
    # 诊断包密文：命名卷，第一次创建时沿用镜像里这个目录的属主（node），容器以非 root 运行也能写；开发者用 docker compose cp 取出。
    volumes:
      - ./releases:/srv/releases:ro
      - diagnostics:/srv/diagnostics
    ports:
      - "${RELAY_PUBLIC_PORT}:${RELAY_PORT}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 同镜像里的 HEALTHCHECK：请求本机就绪探测 /v1/health/ready（MySQL 与 Redis 各限 1 秒，人工决策见 src/common/error_monitor.ts）；
    # docker ps 与 docker inspect 的 Health 可见，部署后等它变成 healthy；连续 3 次不就绪标成 unhealthy，docker 不会因此重启，由 scripts/relay_watchdog.sh 重启中转。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:$${RELAY_PORT}/v1/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # [人工决策-2026-11-18 18:10:39] HTTPS 用 Let's Encrypt 的公网 IP 证书（用户在两路实验后选定，没选自签证书加客户端内置：维护省、浏览器能直接打开中转链接）。
  # Nginx 在 8443 终止 HTTPS、转给内网里的中转；80 只给证书签发验证（ACME http-01），其余一律 404。证书 160 小时有效，scripts/tls_cert.sh 每天检查、剩 3 天续，
  # 续不上会在 6 天内全挂，所以外部探活另查证书到期（.github/workflows/relay-health.yml）。旧版本客户端照旧直连 8080 明文，等提高最低版本后再关。
  # 中转按 X-Forwarded-For 取客户端 IP 只信内网来的请求（RELAY_TRUST_PROXY=uniquelocal，人工决策见 src/config/env.ts），Nginx 覆盖这个头、不接客户端自己写的。
  tls:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - tls-certs:/certs:ro
      - acme-webroot:/srv/acme:ro
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 签发与续期证书的工具，不常驻：scripts/tls_cert.sh 用 docker compose run 调它（profiles 让 up 不启动它）。
  # acme.sh 按镜像摘要固定（v3.1.7；3.1.1 还没有 --cert-profile，Docker Hub 上没有 3.1.7 这个标签），升级时改摘要并先在非线上核对 shortlived 档能签。
  acme:
    image: neilpang/acme.sh@sha256:475e6c0f1fb861ea8011d7ab9dd3d7490d98540970827ecc36290a3afa411673
    profiles: ["tools"]
    volumes:
      - acme-home:/acme.sh
      - acme-webroot:/webroot
      - tls-certs:/out

  # MySQL 与 Redis 固定到补丁版：升级时改这里，先跑一次备份（scripts/backup_db.sh）；CI（ci.yml、relay-image.yml）与 docker-compose.test.yml 用同一版本，一起改。
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 只读查询 5 秒、锁等待 5 秒超时，慢查询不拖垮连接池；服务端会话时区 UTC。
    # 小内存机器（2GB 以内）：关闭 performance_schema（约省 200MB），缓冲池 128MB 足够信箱规模；数据量增长后再调大。
    # [人工决策-2026-11-17 21:24:25] 关掉 binlog（用户同意审查建议 P2-6，同时定了备份只放服务器本机盘、不做按时间点恢复）：没有从库、也不做时间点恢复，
    # binlog 只让每次提交多一次落盘与两阶段提交，8.4 默认还保留 30 天，在 40GB 的小盘上随信箱的写删一直涨。恢复靠每天的 mysqldump（scripts/backup_db.sh）。
    # 没选「保留 1 天」：binlog 不进备份，留着也做不了时间点恢复，只剩开销。以后要从库或时间点恢复再打开（去掉这一项、设 binlog_expire_logs_seconds、binlog 一起备份）。
    # 已有的库第一次换上这一项前先删旧 binlog，步骤见 README「部署」。
    command: ["--max-execution-time=5000", "--innodb-lock-wait-timeout=5", "--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--performance-schema=OFF", "--innodb-buffer-pool-size=128M", "--disable-log-bin"]
    # 内存上限 512MB（人工决策见 relay 一节）：按上面的参数空闲约 200MB，余量给 20 个连接的会话缓冲与临时表。
    mem_limit: 512m
    oom_score_adj: -500
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅首次初始化空库时执行建表；之后的表结构变更由人工执行。
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    # Redis 只放可丢的运行态（邀请、限流、随机数），不开持久化；内存上限 256MB，满了按 TTL 淘汰。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    # 内存上限 320MB（人工决策见 relay 一节）：maxmemory 256MB 加碎片与连接缓冲的余量。
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  mysql-data:
  diagnostics:
  # 证书、签发验证用的目录与 acme.sh 的账号和续期记录：命名卷，不在部署目录里（部署脚本比对文件时不碰），也不进备份（丢了重新签发即可）。
  tls-certs:
  acme-webroot:
  acme-home:
