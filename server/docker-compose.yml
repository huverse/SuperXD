# 单机部署：中转服务 + MySQL + Redis。只对外暴露中转端口，数据库与缓存只在内部网络。
# 用法见 README「部署」：复制 .env.example 为 .env 并改密码；中转镜像用流水线构建、服务器 docker load 后按 RELAY_IMAGE 运行，本机构建（--build）只作退路。
services:
  relay:
    # 默认 superxd-relay:local（本机 --build 的产物）；正式部署在 .env 写 RELAY_IMAGE=superxd-relay:<提交号>（docker load 进来的镜像）。
    image: ${RELAY_IMAGE:-superxd-relay:local}
    # 只用本机已有的镜像、不去仓库拉；配合 up --no-build，标签写错时直接报错，不会悄悄在服务器上现场构建。
    pull_policy: never
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY}
        # 本机构建时可在命令前写 RELAY_BUILD_VERSION=<提交号>；不要写进 .env（env_file 会盖掉镜像里的值）。
        RELAY_BUILD_VERSION: ${RELAY_BUILD_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RELAY_RELEASES_DIR: /srv/releases
      RELAY_DIAGNOSTICS_DIR: /srv/diagnostics
    # 应用更新的清单与安装包：发版时放进宿主机 ./releases，容器只读。
    # 诊断包密文：命名卷，第一次创建时沿用镜像里这个目录的属主（node），容器以非 root 运行也能写；开发者用 docker compose cp 取出。
    volumes:
      - ./releases:/srv/releases:ro
      - diagnostics:/srv/diagnostics
    ports:
      - "${RELAY_PUBLIC_PORT}:${RELAY_PORT}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 同镜像里的 HEALTHCHECK：请求本机 /v1/health；docker ps 与 docker inspect 的 Health 可见，部署后等它变成 healthy。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:$${RELAY_PORT}/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # MySQL 与 Redis 固定到补丁版：升级时改这里，先跑一次备份（scripts/backup_db.sh）。
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 只读查询 5 秒、锁等待 5 秒超时，慢查询不拖垮连接池；服务端会话时区 UTC。
    # 小内存机器（2GB 以内）：关闭 performance_schema（约省 200MB），缓冲池 128MB 足够信箱规模；数据量增长后再调大。
    command: ["--max-execution-time=5000", "--innodb-lock-wait-timeout=5", "--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--performance-schema=OFF", "--innodb-buffer-pool-size=128M"]
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅首次初始化空库时执行建表；之后的表结构变更由人工执行。
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    # Redis 只放可丢的运行态（邀请、限流、随机数），不开持久化；内存上限 256MB，满了按 TTL 淘汰。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  mysql-data:
  diagnostics:
